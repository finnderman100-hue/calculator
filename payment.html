
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Payment Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 40px 20px;
        }

        .calculator {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background-color: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #28558a;
        }

        #result {
            margin-top: 24px;
            padding: 15px;
            background-color: #eef5ff;
            line-height: 1.6;
            border-radius: 5px;
        }
    </style>

    <script>
        function calculatePayment() {
            let PV = Number(document.getElementById("loanAmount").value);
            let n = Number(document.getElementById("years").value);
            let r = Number(document.getElementById("interestRate").value);

            if (
                document.getElementById("loanAmount").value === "" ||
                document.getElementById("years").value === "" ||
                document.getElementById("interestRate").value === "" ||
                !Number.isFinite(PV) ||
                !Number.isFinite(n) ||
                !Number.isFinite(r) ||
                PV <= 0 || n <= 0 || r <= 0
            ) {
                document.getElementById("result").textContent =
                    "Please enter a loan amount, number of years, and interest rate greater than zero.";
                return;
            }

            let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));

            document.getElementById("result").textContent =
                "If you have a $" + PV.toFixed(2) +
                " loan for " + n +
                " years at " + r +
                "% interest, your monthly payment will be $" +
                P.toFixed(2) + ".";
        }
    </script>
</head>

<body>
    <div class="calculator">
        <h1>Loan Payment Calculator</h1>

        <label for="loanAmount">Loan Amount ($):</label>
        <input type="number" id="loanAmount" min="0.01"
               step="0.01" placeholder="Enter loan amount">

        <label for="years">Number of Years:</label>
        <input type="number" id="years" min="0.01"
               step="0.01" placeholder="Enter number of years">

        <label for="interestRate">Annual Interest Rate (%):</label>
        <input type="number" id="interestRate" min="0.01"
               step="0.01" placeholder="Enter interest rate">

        <button type="button" onclick="calculatePayment()">
            Calculate Monthly Payment
        </button>

        <p id="result">
            Enter your loan information and click Calculate to see your monthly payment.
        </p>
    </div>
</body>
</html>
